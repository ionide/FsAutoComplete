name: Release

# CHANGELOG.md drives releases. When main gets a changelog whose newest version has no
# GitHub release yet, the release job publishes the package to NuGet, then tags the commit
# and creates the GitHub release, with that version's changelog section as its notes and
# the package as its asset.
#
# The release is the last step, and its absence is what starts one. A run that failed part
# way is retried with "Run workflow" on main: pushing to NuGet skips packages that are
# already there.
#
# Publishing uses NuGet trusted publishing: the nuget.org policy names this workflow file,
# and the `NUGET_USER` secret holds the nuget.org account that owns that policy.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is the newest changelog version released?
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+[^]]*)\].*/\1/p' CHANGELOG.md | head -n 1)"
          if [ -z "$version" ]; then
            echo "no version in CHANGELOG.md yet, only [Unreleased]"
            exit 0
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          echo "releasing $version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      DOTNET_INSTALL_DIR: ".dotnet"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Projects are multi-targeted, so the pack builds all supported TFMs
      # (net8.0;net9.0;net10.0) using the .NET 10 SDK installed here.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      # Trusted publishing: exchanges the GitHub OIDC token for a short-lived NuGet API key.
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet and create the GitHub release
        run: dotnet fsi build.fsx -- -p Release
        env:
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
