version: 2
updates:
  # The workflows pin each action to a commit SHA, with its version in a comment. Dependabot updates both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    # Generated by `gh aw compile` from repo-assist.md, which pins its own actions.
    exclude-paths:
      - ".github/workflows/repo-assist.lock.yml"
